name: Workflow Quality

on:
  push:
    branches: ["main", "v3/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Validate configuration
        run: python scripts/ai-feature.py validate-config
      - name: Validate JSON schemas parse
        run: python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('schemas').glob('*.json')]"
      - name: Run tests
        run: python -m unittest discover -s tests -v

# AI Workflow v3 configuration. Runtime-owned settings are validated by scripts/ai-feature.py validate-config.
# Keep this file technology-independent; project stacks belong to project context.
version: "3.1.0"
workflow:
  phases: [intelligence, analysis, design, plan, execute, verify, learn, final]
  jira_style: true
  design_assessment_required: true
  human_approval_for_high_risk: true
commit_rule:
  format: "type(scope): description"
  types: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
  imperative: true
  max_chars: 72
  forbidden_punctuation: [".", ";", ":"]
intelligence:
  enabled: true
  artifacts:
    codebase: "docs/architecture/CODEBASE_INTELLIGENCE.md"
    system: "docs/architecture/SYSTEM_ARCHITECTURE.md"
    data: "docs/architecture/DATA_ARCHITECTURE.md"
    security: "docs/architecture/SECURITY_ARCHITECTURE.md"
    technology_map: "docs/kb/TECHNOLOGY_MAP.md"
    development_guide: "docs/kb/DEVELOPMENT_GUIDE.md"
    gotchas: "docs/kb/GOTCHAS.md"
  freshness:
    revision_tracking: git_rev_parse_short
  policy:
    full_refresh_triggers:
      - first_initialization
      - major_architecture_change
      - major_dependency_change
      - new_application_or_service
      - database_redesign
    targeted_review_triggers:
      - undocumented_module
      - unfamiliar_technology
      - unknown_execution_path
      - security_sensitive_change
      - integration_change
feature_analysis:
  required_sections:
    - execution_path
    - affected_files
    - dependencies
    - data_impact
    - security_impact
    - integration_impact
    - test_impact
    - blast_radius
    - risks
    - assumptions
    - unknowns
design:
  enabled: true
  classifications: [full, targeted, existing_design, not_required]
  full_design_triggers:
    - new_system_or_service
    - new_domain_or_major_module
    - data_model_redesign
    - external_payment_or_financial_flow
    - identity_or_authorization_redesign
    - distributed_or_event_driven_workflow
    - major_infrastructure_change
  targeted_design_triggers:
    - new_api_or_integration
    - new_persistence_behavior
    - cross_module_change
    - performance_sensitive_change
  required_references:
    - design_classification
    - rationale
    - design_artifacts
    - related_edd_or_adr
    - review_outcome
execution:
  atomic_subtasks: true
  require_tests: true
  require_verification: true
  one_subtask_at_a_time: true
  require_all_planned_subtasks_complete: true
learning:
  enabled: true
  feature_learning_required: true
  sprint_learning_pack_required: true
  require_source_references: true
  require_engineer_review: true
  publish_only_after_approval: true
knowledge:
  canonical_source: git_versioned_documents
  records_path: "knowledge/records"
  sources: [README.md, AGENTS.md, docs/architecture, docs/design, docs/features, docs/guides, docs/kb, docs/sprints]
  index_path: ".ai-workflow/cache/knowledge.sqlite3"
  chunk_max_chars: 5000
  chunk_overlap_chars: 350
  lifecycle: [draft, under_review, approved, deprecated, superseded]
  require_provenance: true
  require_scope: true
  require_version: true
  retrieval_interfaces: [local_cli, rest_openapi, mcp, markdown_json_export]
  derived_indexes_are_authoritative: false
state:
  file: ".ai-workflow-state.json"
  feature_dir: ".ai-workflow/state/features"
  sprint_dir: "docs/sprints"
templates:
  feature_source: "docs/features/template/README.md"
  feature_manifest: "docs/features/{{ticket_id}}/README.md"
  sprint_plan: "docs/sprints/templates/SPRINT_PLAN.md"
  sprint_summary: "docs/sprints/templates/SPRINT_SUMMARY.md"
  sprint_learning_pack: "docs/sprints/templates/LEARNING_PACK.md"
docs:
  root: "docs/"
  architecture: "docs/architecture/"
  design: "docs/design/"
  knowledge_base: "docs/kb/"
  features: "docs/features/"
  sprints: "docs/sprints/"
  guides: "docs/guides/"
  api: "docs/api/"
git_hook:
  path: ".git/hooks/commit-msg"
  installer: "scripts/install-hooks.py"
